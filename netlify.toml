# Netlify build for the Next.js App Router.
# Do not put secrets here. Set them in the Netlify UI or CLI as environment variables.
# Required at runtime: APP_USERNAME, SESSION_SECRET (32+ characters),
# GOOGLE_DRIVE_FOLDER_ID, and either GOOGLE_CLIENT_EMAIL + GOOGLE_PRIVATE_KEY
# or GOOGLE_SERVICE_ACCOUNT_KEY.
# Prefer APP_PASSWORD_HASH over APP_PASSWORD.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
